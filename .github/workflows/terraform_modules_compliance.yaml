name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/terraform/**'
      - '.github/workflows/terraform_modules_compliance.yaml'

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@efdd72c768efaca41f992322fa51a830e90f4990  # main
    with:
      terraform-directories: '["terraform/dovecot", "terraform/postfix-relay", "dovecot-charm/terraform", "opendkim-operator/terraform", "postfix-relay-operator/terraform", "postfix-relay-configurator-operator/terraform"]'
