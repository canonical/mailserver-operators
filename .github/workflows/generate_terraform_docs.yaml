name: Generate Terraform docs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '**/terraform/**'
      - '.github/workflows/generate_terraform_docs.yaml'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-terraform-docs:
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    secrets: inherit
    with:
      terraform-directory: 'terraform/dovecot,terraform/postfix-relay,dovecot-charm/terraform,opendkim-operator/terraform,postfix-relay-operator/terraform,postfix-relay-configurator-operator/terraform'
