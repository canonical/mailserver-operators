name: Publish snap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - opendkim-snap/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: snapcore/action-build@v1.3.0
      id: build
      with:
        path: ./opendkim-snap
    - uses: snapcore/action-publish@v1.2.0
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPSTORE_TOKEN }}
      with:
        snap: ${{ steps.build.outputs.snap }}
        release: edge
