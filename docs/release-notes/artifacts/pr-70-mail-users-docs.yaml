- title: Documented mail-user configuration and secret recovery
  author: Ignavar
  type: minor
  description: |
    Added a how-to guide for adding Dovecot mail users through a Juju secret,
    granting application access, and updating credentials. Clarified that Bacula
    does not back up or restore mail users or Juju secrets, and documented the
    need to protect secrets and preserve the backup encryption passphrase separately.
