version_schema: 2

changes:
- title: Migrated Dovecot authentication to virtual users
  author: Ignavar
  type: breaking
  description: |
    Replaced Linux system-user authentication with a managed Dovecot passwd-file and a stable
    `vmail:vmail` mailbox identity. Credentials can be supplied through the `mail-users`
    configuration or synchronized from an external passwd-file with last-known-good fallback.
    The `create-mail-user` action was removed.
  urls:
    pr:
      - "https://github.com/canonical/mailserver-operators/pull/65"
    related_doc:
    related_issue:
  visibility: public
  highlight: true
